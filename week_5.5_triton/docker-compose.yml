services:
  triton:
    build: .
    image: triton-cola:latest
    container_name: triton_server
    ports:
      - "8100:8000"   # HTTP inference
      - "8101:8001"   # gRPC inference
      - "8102:8002"   # Prometheus metrics
    volumes:
      - ./model_repository:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8100/v2/health/ready" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
